name: Deploy server (Supabase + bot)

# Выкладывает функции api и bot в Supabase, задаёт им секреты, ставит вебхук и меню бота.
# Запуск: вкладка Actions → «Deploy server» → Run workflow. Также запускается сам
# при изменениях в supabase/ или src/ (если секреты уже заданы).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['supabase/**', 'src/**']

concurrency:
  group: server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      # Адрес игры на GitHub Pages: https://<владелец>.github.io/<репозиторий>/
      WEBAPP_URL: ${{ vars.WEBAPP_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
    steps:
      - name: Check configuration
        id: cfg
        run: |
          missing=""
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing="$missing SUPABASE_ACCESS_TOKEN(secret)"
          [ -z "$PROJECT_REF" ] && missing="$missing SUPABASE_PROJECT_REF(variable)"
          [ -z "${{ secrets.BOT_TOKEN }}" ] && missing="$missing BOT_TOKEN(secret)"
          [ -z "${{ secrets.WEBHOOK_SECRET }}" ] && missing="$missing WEBHOOK_SECRET(secret)"
          [ -z "${{ vars.BOT_USERNAME }}" ] && missing="$missing BOT_USERNAME(variable)"
          [ -z "${{ vars.ADMIN_IDS }}" ] && missing="$missing ADMIN_IDS(variable)"
          if [ -n "$missing" ]; then
            echo "::warning::Сервер не выложен — не заданы:$missing (см. docs/SETUP.md)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      - uses: supabase/setup-cli@v1
        if: steps.cfg.outputs.ready == 'true'
        with:
          # Зафиксированная версия: в 3.x поменялись флаги (--remote, --yes)
          version: 3.0.0

      - name: Server code is in sync with src/
        if: steps.cfg.outputs.ready == 'true'
        run: node scripts/sync-server.mjs && git diff --exit-code supabase/functions/_shared

      - name: Set function secrets
        if: steps.cfg.outputs.ready == 'true'
        run: |
          supabase secrets set --remote="$PROJECT_REF" --yes \
            BOT_TOKEN="${{ secrets.BOT_TOKEN }}" \
            BOT_USERNAME="${{ vars.BOT_USERNAME }}" \
            WEBHOOK_SECRET="${{ secrets.WEBHOOK_SECRET }}" \
            ADMIN_IDS="${{ vars.ADMIN_IDS }}" \
            WEBAPP_URL="$WEBAPP_URL"

      - name: Deploy functions
        if: steps.cfg.outputs.ready == 'true'
        run: |
          supabase functions deploy api --remote="$PROJECT_REF" --no-verify-jwt --use-api --yes
          supabase functions deploy bot --remote="$PROJECT_REF" --no-verify-jwt --use-api --yes

      - name: Set up bot (webhook, commands, «Играть» button)
        if: steps.cfg.outputs.ready == 'true'
        run: npm ci --omit=dev && node scripts/bot-setup.mjs
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          ADMIN_IDS: ${{ vars.ADMIN_IDS }}

      - name: Check API responds
        if: steps.cfg.outputs.ready == 'true'
        run: |
          api="https://${PROJECT_REF}.supabase.co/functions/v1/api"
          code=$(curl -s -o /tmp/api.json -w '%{http_code}' -X POST "$api" -H 'Content-Type: application/json' -d '{"op":"state"}')
          cat /tmp/api.json; echo
          # Без подписи Telegram функция должна ответить 401 — значит, она жива и проверяет доступ
          [ "$code" = "401" ] || { echo "::error::API ответил $code вместо 401"; exit 1; }
          # А проверка базы — 200: значит, таблицы созданы (SQL из supabase/migrations выполнен)
          code=$(curl -s -o /tmp/ping.json -w '%{http_code}' -X POST "$api" -H 'Content-Type: application/json' -d '{"op":"ping"}')
          cat /tmp/ping.json; echo
          [ "$code" = "200" ] || { echo "::error::База не отвечает ($code). Выполните supabase/migrations/0001_init.sql в SQL Editor (docs/SETUP.md, шаг 2)"; exit 1; }
