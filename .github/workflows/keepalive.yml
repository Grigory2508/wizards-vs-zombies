name: Keep Supabase awake

# Бесплатный проект Supabase засыпает после недели без запросов к базе (например, на каникулах).
# Раз в три дня делаем лёгкий запрос к базе через функцию api.
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: vars.SUPABASE_PROJECT_REF != ''
    steps:
      - name: Ping
        run: |
          curl -fsS -X POST "https://${{ vars.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1/api" \
            -H 'Content-Type: application/json' -d '{"op":"ping"}'
